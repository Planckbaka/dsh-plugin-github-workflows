name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Type check (JSDoc types + tsc --noEmit)
        run: |
          npm install --no-save typescript@5 @types/node
          npx tsc --noEmit

      - name: Syntax-check every JS file
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.js,*.mjs -Path lib,test | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Selfcheck (schema subset + argv builders + read-only gh smoke)
        run: npm test

      - name: Integration (registry pipeline against a fake ctx)
        run: npm run test:integration
